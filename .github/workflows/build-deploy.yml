name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: registry.v0l.io

jobs:
  # The Docker build only transpiles (Vite), so type errors do not fail it.
  # Runs alongside `build` rather than gating it, so a type error is visible
  # without blocking an otherwise-working image.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

  # `typecheck` and `build` both leave server/dev.ts untouched, which is how a
  # missing `express` dependency stayed green through CI (#44). Actually start
  # the documented dev entry point and require a rendered page back.
  dev-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Start dev server and wait for a 200
        run: |
          bun server/dev.ts > dev-server.log 2>&1 &
          pid=$!
          for _ in $(seq 1 30); do
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "dev server exited before serving a request"
              cat dev-server.log
              exit 1
            fi
            code=$(curl -fsS -o /dev/null -w '%{http_code}' http://localhost:3000/ || true)
            if [ "$code" = "200" ]; then
              kill "$pid"
              exit 0
            fi
            sleep 2
          done
          echo "dev server did not serve a 200 within 60s (last code: ${code:-none})"
          cat dev-server.log
          kill "$pid" 2>/dev/null || true
          exit 1

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Registry
        if: github.event_name != 'pull_request'
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 5
          retry_wait_seconds: 15
          # SYN drops in the AVS/GSL scrubbing path randomly kill handshakes
          # under concurrent CI logins; retry to ride over transient drops.
          command: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login ${{ env.REGISTRY }} -u registry --password-stdin

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: registry.v0l.io/lnvps-web:latest
          build-args: MODE=production
          platforms: linux/amd64
